name: InferPeerSandbox

options:
  bundleIdPrefix: in.kodlabs
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1

packages:
  InferPeer:
    path: ../inferpeer-swift

targets:
  InferPeerSandbox-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/Client
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Resources/SharedAssets.xcassets
      - Resources/iOSAssets.xcassets
    info:
      path: Support/Sandbox-iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: InferPeer Sandbox
        NSBonjourServices: [_inferpeer._tcp]
        NSLocalNetworkUsageDescription: InferPeer discovers and connects to approved model resources on your local network.
        NSPhotoLibraryUsageDescription: InferPeer Sandbox uses selected images only for the inference request you send.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.kodlabs.inferpeer.sandbox
        PRODUCT_NAME: InferPeerSandbox
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-iOS
    dependencies:
      - package: InferPeer
        product: InferPeer
      - package: InferPeer
        product: InferPeerApple
      - package: InferPeer
        product: InferPeerCore
      - package: InferPeer
        product: InferPeerDiscovery
      - package: InferPeer
        product: InferPeerGRPC
      - package: InferPeer
        product: InferPeerInference
      - package: InferPeer
        product: InferPeerModelStore
      - package: InferPeer
        product: InferPeerSecurity

  InferPeerSandboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/iOSUITests
    dependencies:
      - target: InferPeerSandbox-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.kodlabs.inferpeer.sandbox.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: InferPeerSandbox-iOS

schemes:
  InferPeerSandbox-iOS:
    build:
      targets:
        InferPeerSandbox-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InferPeerSandboxUITests
